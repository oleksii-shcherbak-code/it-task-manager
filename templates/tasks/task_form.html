{% extends "base.html" %}

{% block title %}<title>Task Form</title>{% endblock %}

{% block content %}
  <h2>{% if form.instance.pk %}Edit Task{% else %}Create Task{% endif %}</h2>
  <form method="post" class="mt-3">
    {% csrf_token %}
    <div class="mb-3">
      {{ form.as_p }}
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'task-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
