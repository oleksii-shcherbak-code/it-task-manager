{% extends "base.html" %}
{% block content %}
  <h2>{% if form.instance.pk %}Edit Task Type{% else %}Create Task Type{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Save</button>
  </form>
  <a href="{% url 'task-type-list' %}" class="btn btn-secondary">Cancel</a>
{% endblock %}
