{% extends "base.html" %}
{% load static %}

{% block content %}
  <div class="container mt-4">

    <h2 class="mb-4">Choose your avatar</h2>

    <form method="post">
      {% csrf_token %}

      <!-- CURRENT AVATAR -->
      <div class="text-center mb-4">
        <h4>Current avatar</h4>
        <img src="{% static 'avatars/' %}{{ user.avatar }}"
             class="current-avatar-img"
             width="140" height="140">
      </div>

      <hr class="my-4">

      <!-- GRID 3x3 OF OTHER AVATARS -->
      <h4 class="mb-3">Available avatars</h4>

      <div class="row g-4 justify-content-center">

        {% for file in avatars %}
          {% if file != user.avatar %}
            <div class="col-4 col-md-2 text-center">

              <label class="avatar-option">

                <!-- Hidden radio -->
                <input type="radio"
                       name="avatar"
                       value="{{ file }}">

                <!-- Avatar image -->
                <img src="{% static 'avatars/' %}{{ file }}"
                     class="avatar-img">
              </label>

            </div>
          {% endif %}
        {% endfor %}

      </div>

      <div class="text-center mt-4">
        <button class="btn btn-primary px-4">Save</button>
      </div>

    </form>

  </div>

  <style>
      /* Current avatar */
      .current-avatar-img {
          border-radius: 50%;
          border: 4px solid #0d6efd;
          box-shadow: 0 0 12px rgba(13, 110, 253, 0.4);
      }

      /* Hide radio buttons */
      .avatar-option input[type="radio"] {
          display: none;
      }

      /* Avatar grid images */
      .avatar-img {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: 3px solid transparent;
          cursor: pointer;
          transition: 0.2s;
      }

      /* Hover effect */
      .avatar-img:hover {
          transform: scale(1.1);
      }

      /* Selected avatar */
      .avatar-img.selected {
          border-color: #0d6efd;
          box-shadow: 0 0 10px rgba(13, 110, 253, 0.5);
      }
  </style>

  <script>
      // Highlight selected avatar
      document.addEventListener("DOMContentLoaded", () => {
          const images = document.querySelectorAll(".avatar-img");

          images.forEach(img => {
              img.addEventListener("click", () => {

                  // Remove selection from all
                  images.forEach(i => i.classList.remove("selected"));

                  // Highlight clicked
                  img.classList.add("selected");

                  // Activate radio
                  img.previousElementSibling.checked = true;
              });
          });
      });
  </script>

{% endblock %}
