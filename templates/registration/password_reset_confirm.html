{% extends "base.html" %}
{% block title %}<title>Set New Password</title>{% endblock %}
{% block content %}
  <div class="container mt-4">
    <h2>Enter new password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Change password</button>
    </form>
  </div>
{% endblock %}
