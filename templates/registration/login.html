{% extends "base.html" %}
{% block title %}<title>Login</title>{% endblock %}

{% block content %}
  <div class="container mt-4">
    <h2>Login</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Login</button>
      <a href="{% url 'password_reset' %}" class="btn btn-link">Forgot password?</a>
    </form>

    <p class="mt-3">
      Don't have an account?
      <a href="{% url 'register' %}" class="btn btn-success">Register here</a>
    </p>
  </div>
{% endblock %}
