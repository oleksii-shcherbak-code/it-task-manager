{% load static %}

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-2">
  <div class="container-fluid">

    <!-- Left: Logo -->
    <a class="navbar-brand fw-bold" href="{% url 'index' %}">
      Task Manager
    </a>

    <!-- Mobile toggle -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar content -->
    <div class="collapse navbar-collapse" id="mainNavbar">

      <!-- Center: Search -->
      <form class="d-flex mx-auto w-50" method="get" action="{% url 'search' %}">
        <input class="form-control" type="search" name="q" placeholder="Search tasks, workers..." aria-label="Search">
      </form>

      <!-- Right: Profile -->
      <ul class="navbar-nav ms-auto">

        <!-- Create Task -->
        <li class="nav-item me-3">
          <a class="btn btn-primary" href="{% url 'task-create' %}">
            + Create Task
          </a>
        </li>

        <!-- Profile dropdown -->
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="profileDropdown"
             role="button" data-bs-toggle="dropdown" aria-expanded="false">

            <!-- Avatar -->
            <img src="{% static 'avatars/' %}{{ user.avatar }}"
                 alt="avatar"
                 class="rounded-circle me-2"
                 width="32" height="32">

            <!-- Name -->
            <span>{{ user.first_name }}</span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
            <li><a class="dropdown-item" href="{% url 'profile' %}">Profile</a></li>
            <li><a class="dropdown-item" href="{% url 'avatar-change' %}">Change Avatar</a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item text-danger" href="{% url 'logout' %}">Logout</a></li>
          </ul>
        </li>

      </ul>
    </div>
  </div>
</nav>
